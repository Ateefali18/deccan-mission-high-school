# Netlify configuration for Deccan Mission High School ERP (DMHS ERP)

# Build settings when deploying from the repository root
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Node.js environment version
[build.environment]
  NODE_VERSION = "20"

# SPA (Single Page Application) rewrite rule
# Ensures client-side routing works properly when refreshing pages (e.g., /admin/dashboard, /login)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
