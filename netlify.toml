# Netlify configuration for Deccan Mission High School ERP (DMHS ERP)

# Build settings when deploying from the repository root
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# Node.js environment version
[build.environment]
  NODE_VERSION = "20"

# Function API rewrite
[[redirects]]
  from = "/api/send-otp"
  to = "/.netlify/functions/send-otp"
  status = 200

# SPA (Single Page Application) rewrite rule
# Ensures client-side routing works properly when refreshing pages (e.g., /admin/dashboard, /login)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hardened Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.netlify.app http://localhost:* ws://localhost:*;"
